<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escape Room</title>
    <style>
        body {
            background-image: url(../fondos/bg2.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column; /* Coloca elementos en vertical */
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .botones {
            margin-bottom: 20px; /* Espacio entre botones y título */
        }

        button.colores {
            height: 50px;
            width: 50px;
            margin: 5px;
            border: none;
            cursor: pointer;
        }

        input {
            padding: 8px;
            font-size: 16px;
        }

        #btnpass {
            padding: 8px 12px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="botones">
        <button class="colores" style="background-color: red;"></button>
        <button class="colores" style="background-color: blue;"></button>
        <button class="colores" style="background-color: yellow;"></button>
        <button class="colores" style="background-color: green;"></button>
    </div>

    <form action="">
        <h1>Introduce las credenciales, usando la tabla de conversion
            <br>(código de 4 caracteres)</h1>
        <input type="text" id="pass" maxlength="4">
        <button type="button" id="btnpass" onclick="comprobar()">&gt;</button>
    </form>

    <script>
        const PASSWORD = "6c9a";

        function comprobar() {
            let pass = document.getElementById("pass");

            if (pass.value.trim().toLowerCase() !== PASSWORD) {
                alert("Contraseña Incorrecta");
                pass.value = "";
            } else {
                alert("Contraseña Correcta");
                alert("Acceso Autorizado");
                setTimeout(() => {
                    window.location.href = "prueba3.0.html";
                }, 3000);
            }
        }
    </script>

</body>
</html>
